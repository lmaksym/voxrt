[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "voxrt"
description = "Fast, deterministic speech-to-text runtime for moondream/parakeet-redux (ternary Parakeet-TDT), in Rust"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License", "Topic :: Multimedia :: Sound/Audio :: Speech"]
dynamic = ["version"]
dependencies = ["huggingface_hub>=0.20"]

[project.optional-dependencies]
audio = ["soundfile>=0.12", "numpy"]   # FLAC / OGG / MP3 input and array conversion
test = ["pytest>=7", "soundfile>=0.12", "numpy"]

[project.urls]
Model = "https://huggingface.co/moondream/parakeet-redux"

[tool.maturin]
python-source = "python"
module-name = "voxrt._voxrt"
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
