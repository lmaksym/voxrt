[package]
name = "voxrt-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings for the Parakeet Redux runtime"

[lib]
name = "_voxrt"
crate-type = ["cdylib"]

[features]
metal = ["voxrt/metal"]   # Apple GPU encoder (VOXRT_DEVICE=gpu)
coreml = ["voxrt/coreml"] # Apple Neural Engine encoder (VOXRT_DEVICE=ane)

[dependencies]
voxrt = { version = "0.1.0", path = "../../crates/voxrt" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
