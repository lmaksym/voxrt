[package]
name = "voxrt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "voxrt"
path = "src/main.rs"

[features]
default = ["metal", "coreml"]
metal = ["voxrt/metal"]   # Apple GPU encoder (VOXRT_DEVICE=gpu)
coreml = ["voxrt/coreml"] # Apple Neural Engine encoder (VOXRT_DEVICE=ane, needs a converted bundle)

[dependencies]
voxrt = { version = "0.1.0", path = "../voxrt" }
anyhow = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
libc = "0.2"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] } # first-run model download
