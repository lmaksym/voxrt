language = "C"
include_guard = "VOXRT_H"
pragma_once = false
autogen_warning = "/* Generated by cbindgen from crates/voxrt-ffi (scripts/gen_header.sh); do not edit. */"
include_version = true
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true

[export]
prefix = ""
item_types = ["functions", "structs", "opaque", "enums", "constants"]

[fn]
args = "horizontal"
