# Self-reported. Word error rate in percent, scored with the Open ASR Leaderboard's own pipeline (its normalizers as of
# September 2026) on the leaderboard's test sets, through Photon (https://moondream.ai/photon). Details in the model
# card. The leaderboard's TED-LIUM split is no longer distributed; tedlium_wer scores the same eleven TED-LIUM 3 test
# talks in full (the card's long-form set), and mean_wer averages all eight sets. The card's 'Open ASR' figure (6.55)
# is the mean of the other seven.

- dataset:
    id: hf-audio/open-asr-leaderboard
    task_id: mean_wer
  value: 6.05
  date: '2026-09-21'
  source:
    url: https://huggingface.co/moondream/parakeet-redux
    name: moondream
