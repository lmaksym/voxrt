[workspace]
resolver = "2"
members = ["crates/prx-core", "crates/prx-cli", "crates/prx-ffi"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
half = "2"
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3"
rayon = "1"
thiserror = "2"
anyhow = "1"
criterion = { version = "0.5", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"
